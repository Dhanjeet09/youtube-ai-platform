services:
  - type: web
    name: youtube-ai-api
    env: node
    dockerfilePath: ./Dockerfile
    region: singapore
    startCommand: npm run start:prod
    healthCheckPath: /
    autoDeploy: yes
    envVars:
      - key: NODE_ENV
        value: production

      # ─── Server ─────────────────────────────────────────────
      - key: API_KEY
        generateValue: true
        sync: false
      - key: JWT_SECRET
        generateValue: true
        sync: false
      - key: SERVERLESS
        value: "true"

      # ─── MongoDB (REQUIRED) ─────────────────────────────────
      - key: MONGODB_URI
        sync: false

      # ─── AI (REQUIRED) ──────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      # ─── Pexels (REQUIRED) ──────────────────────────────────
      - key: PEXELS_API_KEY
        sync: false

      # ─── YouTube / Google ───────────────────────────────────
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YT_CLIENT_ID
        sync: false
      - key: YT_CLIENT_SECRET
        sync: false
      - key: YT_REDIRECT_URI
        value: https://youtube-ai-platform.onrender.com/api/youtube/callback

      # ─── Credential Encryption Key ──────────────────────────
      # Generate with: openssl rand -hex 32
      # IMPORTANT: If this key is lost, existing encrypted credentials
      # (e.g. YouTube OAuth tokens) cannot be recovered.
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false

      # ─── Frontend ───────────────────────────────────────────
      - key: FRONTEND_URL
        value: https://youtube-ai-platform.vercel.app

      # ─── Storage ────────────────────────────────────────────
      - key: STORAGE_PATH
        value: ./storage

      # ─── R2 / Cloudflare Object Storage ─────────────────────
      - key: R2_ENABLED
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: autotube-assets

      # ─── Rate Limiting ──────────────────────────────────────
      - key: PIPELINE_RATE_LIMIT
        value: "5"
      - key: YOUTUBE_UPLOAD_RATE_LIMIT
        value: "3"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"

      # ─── FIFA World Cup Feature Flags ───────────────────────
      - key: WORLD_CUP_MODE
        value: "true"
      - key: MATCH_POLL_INTERVAL_MS
        value: "300000"
      - key: WORLD_CUP_START_DATE
        sync: false
      - key: WORLD_CUP_END_DATE
        sync: false
